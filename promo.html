<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迴眾 KAI 9.81｜15 秒宣傳影片</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Oswald:wght@500&display=swap">
<style>
:root{color-scheme:dark;--bg:#080808;--red:#d4202a;--ink:#f4f1ea;--dim:#8d8a84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#stage{position:relative;width:min(100%,960px);aspect-ratio:16/9;background:var(--bg);overflow:hidden;border:1px solid #222;container-type:inline-size}
canvas{position:absolute;inset:0;width:100%;height:100%}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
.scene.on{opacity:1}
.en{font-family:Oswald,"Arial Narrow",sans-serif;letter-spacing:.35em;font-size:2.2cqw;color:var(--dim)}
.big{font-weight:900;font-size:9cqw;line-height:1.15;margin:.5cqw 0}
.rise{opacity:0;transform:translateY(3cqw);transition:opacity .7s,transform .7s}
.on .rise{opacity:1;transform:none}
.d1{transition-delay:.2s}.d2{transition-delay:.7s}.d3{transition-delay:1.2s}.d4{transition-delay:1.7s}
.red{color:var(--red)}
.row{display:flex;gap:6cqw;align-items:flex-end;justify-content:center}
.col b{display:block;font-size:11cqw;font-weight:900;line-height:1}
.col span{display:block;margin-top:1cqw;font-size:2cqw;color:var(--dim);letter-spacing:.2em}
.tags{display:flex;flex-wrap:wrap;gap:2cqw;justify-content:center;max-width:80%}
.tags div{border:1px solid var(--red);padding:1.4cqw 3cqw;font-size:4cqw;font-weight:900}
.small{font-size:2.2cqw;color:var(--dim);margin-top:1.6cqw;letter-spacing:.1em}
#bar{width:min(100%,960px);height:4px;background:#222}
#bar i{display:block;height:100%;width:0;background:var(--red)}
.ctl{display:flex;gap:12px;align-items:center;font:14px system-ui,sans-serif;color:var(--dim)}
button{background:var(--red);color:#fff;border:0;padding:8px 18px;font:inherit;cursor:pointer;border-radius:2px}
.fast .d1{transition-delay:.1s}.fast .d2{transition-delay:.35s}.fast .d3{transition-delay:.6s}.fast .d4{transition-delay:.85s}
.wear{display:flex;align-items:center;justify-content:center;gap:2cqw;width:100%;height:92%}
.wear svg{height:100%;width:auto;flex:none}.mid{text-align:center;max-width:34%}
.top{animation:sp .5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5cqw;background:rgba(8,8,8,.85);cursor:pointer;z-index:5;font-size:3.4cqw;font-weight:900}
#cover small{font-size:1.8cqw;color:var(--dim);font-weight:500}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform:scale(1.02);transition:transform 4.5s linear}
.photo.on img{transform:scale(1.14)}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,8,.92) 0%,rgba(8,8,8,.45) 35%,rgba(8,8,8,0) 60%)}

body{min-height:0;padding:0;gap:12px}
#stage,#bar{width:100%;max-width:none}
#cover{width:100%;height:100%;border-radius:0;color:var(--ink);font-family:inherit}
#cover small{font-size:max(11px,1.8cqw)}
.ctl{flex-wrap:wrap;justify-content:center;gap:8px;padding:2px 0 12px;font-size:13px}
button:focus-visible{outline:2px solid #fff;outline-offset:-4px}
@media(prefers-reduced-motion:reduce){.rise,.photo img{transition:none}}

html,body{width:100%;height:100%;padding:0;overflow:hidden}
body{display:block}
#stage{width:100%;height:100vh;height:100dvh;aspect-ratio:auto;border:0}
.big{font-size:clamp(32px,7cqw,110px)}
@media(max-aspect-ratio:3/4){.big{font-size:12cqw}.en{font-size:3cqw}.small{font-size:3.5cqw}.row{gap:4cqw}.col span{font-size:3cqw}.tags div{font-size:5cqw}.photo img{object-position:42% center}}
</style>
</head>

<script>
(function(){
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
  var scenes=[].slice.call(document.querySelectorAll('.scene'));
  var W,H,DUR=15,t0=performance.now(),playing=true,tNow=0;
  function size(){var d=window.devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#080808';ctx.fillRect(0,0,W,H)}
  size();window.addEventListener('resize',size);
  var sp=[];for(var i=0;i<7;i++)sp.push({r:.12+i*.055,w:(i%2?1:-1)*(1.2+i*.55),p:i*1.3,c:i%3==0?'#f4f1ea':'#d4202a'});
  function frame(now){
    if(playing){tNow=Math.max(0,(now-t0)/1000);if(tNow>=DUR){tNow=DUR;playing=false;window.parent.postMessage({type:'kai-promo-complete'},'*')}}
    draw(tNow);
    scenes.forEach(function(s){var a=+s.dataset.s,b=+s.dataset.e;s.classList.toggle('on',tNow>=a&&tNow<b)});
    if(playing)requestAnimationFrame(frame);
  }
  function draw(t){
    ctx.fillStyle='rgba(8,8,8,'+(t<2.5?0.22:0.1)+')';ctx.fillRect(0,0,W,H);
    var cx=W/2,cy=H/2,m=Math.min(W,H);
    if(t<2.8){ // pull-cord streaks
      var k=Math.min(t/2,1),e=1-Math.pow(1-k,3);
      for(var i=0;i<14;i++){
        var y=(i+.5)/14*H,red=i%2==0,dir=i%4<2?1:-1;
        var x=dir>0?-W*.4+e*W*1.4:W*1.4-e*W*1.4;
        ctx.strokeStyle=red?'#d4202a':'#f4f1ea';ctx.globalAlpha=.55*(1-Math.max(0,(t-1.9))/.9);
        ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-dir*W*.35,y+(i-7)*3);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    if(t>=2.2){ // orbits
      var g=Math.min((t-2.2)/2,1);g=1-Math.pow(1-g,3);
      var pulse=t>5&&t<7.5?1+.06*Math.sin((t-5)*5):1;
      ctx.fillStyle='#d4202a';ctx.beginPath();ctx.arc(cx,cy,3,0,7);ctx.fill();
      sp.forEach(function(o){
        var a=o.p+t*o.w,r=o.r*m*1.7*g*pulse;
        var x=cx+Math.cos(a)*r*1.5,y=cy+Math.sin(a)*r*.8;
        ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();
      });
    }
    if(t>=13){ // finale ring
      var f=Math.min((t-13)/1.5,1);ctx.strokeStyle='rgba(212,32,42,'+(.5*f)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(cx,cy,m*.55*f,m*.3*f,t*.5,0,7);ctx.stroke();
    }
  }
  window.parent.postMessage({type:'kai-promo-ready'},'*');
  requestAnimationFrame(frame);
})();
</script>
