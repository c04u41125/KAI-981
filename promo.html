<style>
:root{color-scheme:dark;--bg:#080808;--red:#d4202a;--ink:#f4f1ea;--dim:#9a968e;--f:"Noto Serif JP","Noto Serif TC","Hiragino Mincho ProN","PingFang TC",serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.d1{transition-delay:.1s}.d2{transition-delay:.4s}.d3{transition-delay:.8s}.d4{transition-delay:1.2s}.d5{transition-delay:2s}

.vt{writing-mode:vertical-rl;letter-spacing:.08em;line-height:1.1}
.red{color:var(--red)}

.photo.on img{transform:scale(1.14)}

.slash{position:absolute;top:-10%;left:-30%;width:30%;height:120%;background:var(--red);transform:skewX(-18deg) translateX(-100%)}
.on .slash{animation:wipe .6s ease-in both}@keyframes wipe{0%{transform:skewX(-18deg) translateX(-20%)}100%{transform:skewX(-18deg) translateX(520%)}}

#bar{width:min(100%,960px);height:4px;background:#222}#bar i{display:block;height:100%;width:0;background:var(--red)}
.ctl{display:flex;gap:12px;align-items:center;font:14px system-ui,sans-serif;color:var(--dim)}
button{background:var(--red);color:#fff;border:0;padding:8px 18px;font:inherit;cursor:pointer;border-radius:2px}
